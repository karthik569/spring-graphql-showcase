server:
  port: 8086

spring:
  application:
    name: spring-graphql-showcase
  datasource:
    # A fresh in-memory database per start; swap for Postgres by changing this URL and driver
    url: jdbc:h2:mem:catalog-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql
    cors:
      allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.example.graphql: DEBUG
    # Shows each SQL statement, so the single batched IN (…) query is visible
    org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: logs/spring-graphql-showcase.log

# Query-shape guards applied to every request (see GraphQlLimitsProperties)
graphql:
  limits:
    max-depth: 10
    max-complexity: 200
    max-query-length: 10000

# Dev-only JWT settings: override the secret in any real deployment
security:
  jwt:
    secret: change-me-in-production-this-secret-is-at-least-32-bytes
    ttl: 3600s
